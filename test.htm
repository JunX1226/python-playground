<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本框悬浮显示字体信息</title>
    <style>
        /* ---------- 页面基本样式 ---------- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .form-container {
            background: #fff;
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            width: 400px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #333;
        }

        /* 自定义文本框样式（便于演示不同字体） */
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #d0d7de;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #4f8cf7;
            outline: none;
            box-shadow: 0 0 0 3px rgba(79, 140, 247, 0.2);
        }

        /* 为演示不同字体，分别设置不同样式 */
        #input-name {
            font-family: 'Georgia', serif;
            font-size: 18px;
            color: #2c3e50;
        }

        #input-email {
            font-family: 'Courier New', monospace;
            font-size: 15px;
            color: #16a085;
        }

        #input-bio {
            font-family: 'Arial', sans-serif;
            font-size: 14px;
            color: #8e44ad;
            resize: vertical;
        }

        /* ---------- 悬浮提示框样式 ---------- */
        .font-tooltip {
            position: fixed;          /* 绝对定位，跟随鼠标 */
            pointer-events: none;    /* 防止干扰鼠标事件 */
            background: #1e293b;
            color: #f1f5f9;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
            white-space: nowrap;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.15s ease;
            font-family: 'Segoe UI', sans-serif;
            border-left: 4px solid #4f8cf7;
        }

        .font-tooltip.visible {
            opacity: 1;
        }

        /* 提示框内小标签样式 */
        .font-tooltip .label {
            color: #94a3b8;
            font-weight: 300;
            margin-right: 4px;
        }

        .font-tooltip .value {
            font-weight: 500;
            color: #e2e8f0;
        }

        .font-tooltip .separator {
            margin: 0 6px;
            color: #475569;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2 style="margin-top:0; color:#1e293b;">📝 个人信息</h2>
    <form>

        <div class="form-group">
            <label for="input-name">姓名</label>
            <input type="text" id="input-name" placeholder="请输入姓名">
        </div>

        <div class="form-group">
            <label for="input-email">邮箱</label>
            <input type="email" id="input-email" placeholder="请输入邮箱">
        </div>

        <div class="form-group">
            <label for="input-bio">个人简介</label>
            <textarea id="input-bio" rows="3" placeholder="简单介绍一下自己"></textarea>
        </div>

        <button type="button" style="background:#4f8cf7; color:#fff; border:none; padding:10px 20px; border-radius:8px; font-size:16px; cursor:pointer;">提交</button>
    </form>
</div>

<!-- 悬浮提示框元素 -->
<div id="fontTooltip" class="font-tooltip">
    <!-- 内容由 JavaScript 动态填充 -->
</div>

<script>
    (function() {
        // ---------- 获取元素 ----------
        const tooltip = document.getElementById('fontTooltip');
        // 选择所有需要监听悬浮的文本框（input 和 textarea）
        const targets = document.querySelectorAll('.form-group input, .form-group textarea');

        // ---------- 工具函数：获取元素的最终样式 ----------
        function getFontInfo(element) {
            const style = window.getComputedStyle(element);
            return {
                family: style.fontFamily.replace(/["']/g, ''),  // 去掉引号
                size: style.fontSize,
                weight: style.fontWeight,
                color: style.color,
                lineHeight: style.lineHeight
            };
        }

        // ---------- 更新提示框内容 ----------
        function updateTooltipContent(element) {
            const info = getFontInfo(element);
            // 构建显示文本
            const familyDisplay = info.family.split(',')[0].trim() || '默认';
            tooltip.innerHTML = `
                <span class="label">字体</span><span class="value">${familyDisplay}</span>
                <span class="separator">·</span>
                <span class="label">字号</span><span class="value">${info.size}</span>
                <span class="separator">·</span>
                <span class="label">字重</span><span class="value">${info.weight}</span>
                <span class="separator">·</span>
                <span class="label">颜色</span><span class="value">${info.color}</span>
            `;
        }

        // ---------- 鼠标事件处理 ----------
        function onMouseOver(e) {
            const target = e.currentTarget;
            updateTooltipContent(target);
            tooltip.classList.add('visible');
            // 立即更新位置
            moveTooltip(e);
        }

        function onMouseMove(e) {
            // 只有提示框可见时才移动，提高性能
            if (tooltip.classList.contains('visible')) {
                moveTooltip(e);
            }
        }

        function onMouseOut() {
            tooltip.classList.remove('visible');
        }

        // ---------- 移动提示框（跟随鼠标） ----------
        function moveTooltip(e) {
            // 获取鼠标坐标
            let x = e.clientX;
            let y = e.clientY;

            // 偏移量（避免遮盖鼠标），可调节
            const offsetX = 16;
            const offsetY = 16;

            // 获取提示框尺寸（第一次显示时可能为0，但这里使用offsetWidth/Height）
            const tooltipWidth = tooltip.offsetWidth || 200;
            const tooltipHeight = tooltip.offsetHeight || 60;

            // 边界检测：防止溢出屏幕
            const maxX = window.innerWidth - tooltipWidth - 10;
            const maxY = window.innerHeight - tooltipHeight - 10;

            let left = Math.min(x + offsetX, maxX);
            let top = Math.min(y + offsetY, maxY);

            // 如果右侧空间不足，则显示在鼠标左侧
            if (x + offsetX + tooltipWidth > window.innerWidth - 10) {
                left = Math.max(10, x - tooltipWidth - offsetX);
            }
            // 如果下方空间不足，则显示在鼠标上方
            if (y + offsetY + tooltipHeight > window.innerHeight - 10) {
                top = Math.max(10, y - tooltipHeight - offsetY);
            }

            tooltip.style.left = left + 'px';
            tooltip.style.top = top + 'px';
        }

        // ---------- 绑定事件 ----------
        targets.forEach(el => {
            el.addEventListener('mouseover', onMouseOver);
            el.addEventListener('mousemove', onMouseMove);
            el.addEventListener('mouseout', onMouseOut);
        });

        // 如果页面有动态添加的表单元素，可在此处调用重新绑定函数（示例未包含）

        console.log('✅ 文本框悬浮显示字体脚本已启动');
    })();
</script>

</body>
</html>
